
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>

  <style>
    /* CSS DESIGN */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
      background: linear-gradient(135deg, #0f172a, #4338ca, #818cf8);
    }

    .signup-container {
      width: 100%;
      max-width: 430px;
      background: #fff;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 12px;
    }

    h1 {
      text-align: center;
      color: #1e1b4b;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      color: #333;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px #4f46e51a;
    }

    .password-wrapper {
      display: flex;
      align-items: center;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding-right: 10px;
    }

    .password-wrapper:focus-within {
      border-color: #4f46e5;
    }

    .password-wrapper input {
      border: none;
      box-shadow: none;
    }

    .password-wrapper input:focus {
      box-shadow: none;
    }

    .toggle-btn {
      border: none;
      background: transparent;
      color: #4f46e5;
      cursor: pointer;
      font-size: 13px;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 20px 0;
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }

    .terms input {
      margin-top: 3px;
    }

    a {
      color: #4f46e5;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .signup-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .signup-btn:hover {
      background: #3730a3;
    }

    #message {
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 15px;
    }

    .login-link {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 24px;
    }

    @media (max-width: 450px) {
      .signup-container {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- SIGN UP FORM -->
  <div class="signup-container">

    <div class="logo">✨</div>

    <h1>Create Account</h1>
    <p class="subtitle">Sign up to get started today!</p>

    <form id="signupForm">

      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input
          type="text"
          id="fullname"
          placeholder="Enter your full name"
          autocomplete="name"
          required
          minlength="2"
        >
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="8"
            required
          >
          <button
            type="button"
            class="toggle-btn"
            data-target="password"
          >Show</button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            autocomplete="new-password"
            minlength="8"
            required
          >
          <button
            type="button"
            class="toggle-btn"
            data-target="confirmPassword"
          >Show</button>
        </div>
      </div>

      <label class="terms">
        <input type="checkbox" id="terms" required>
        <span>
          I agree to the
          <a href="#" id="termsLink">Terms & Conditions</a>
          and Privacy Policy.
        </span>
      </label>

      <button type="submit" class="signup-btn">
        Create Account
      </button>

      <p id="message" role="status" aria-live="polite"></p>

    </form>

    <p class="login-link">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

  </div>

  <!-- JAVASCRIPT -->
  <script>
    const form = document.getElementById("signupForm");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const message = document.getElementById("message");

    // Show and hide passwords
    document.querySelectorAll(".toggle-btn").forEach(function(button) {
      button.addEventListener("click", function() {
        const input = document.getElementById(button.dataset.target);
        const visible = input.type === "password";

        input.type = visible ? "text" : "password";
        button.textContent = visible ? "Hide" : "Show";
      });
    });

    // Validate and submit form
    form.addEventListener("submit", function(event) {
      event.preventDefault();

      message.style.color = "#dc2626";

      if (password.value.length < 8) {
        message.textContent =
          "Password must contain at least 8 characters.";
        password.focus();
        return;
      }

      if (password.value !== confirmPassword.value) {
        message.textContent = "Passwords do not match!";
        confirmPassword.focus();
        return;
      }

      if (!document.getElementById("terms").checked) {
        message.textContent =
          "Please accept the Terms & Conditions.";
        return;
      }

      
    // Validate and submit form
    form.addEventListener("submit", function(event) {
      event.preventDefault();

      message.style.color = "#dc2626";

      if (password.value.length < 8) {
        message.textContent =
          "Password must contain at least 8 characters.";
        password.focus();
        return;
      }

      if (password.value !== confirmPassword.value) {
        message.textContent = "Passwords do not match!";
        confirmPassword.focus();
        return;
      }

      if (!document.getElementById("terms").checked) {
        message.textContent =
          "Please accept the Terms & Conditions.";
        return;
      }

      message.style.color = "#16a34a";
      message.textContent = "Account form validated! Opening login page...";

      window.location.href = "login.html";
    });

    });

    document.getElementById("termsLink").addEventListener("click", function(event) {
      event.preventDefault();
      message.style.color = "#4f46e5";
      message.textContent =
        "Add your Terms & Conditions page to this link.";
    });
  </script>

</body>
</html>
