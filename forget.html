<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; display: flex; justify-content: center; padding-top: 60px; }
    .box { background: #fff; padding: 24px; border-radius: 8px; width: 320px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
    button { background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    #message { margin-top: 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h3>Reset Password</h3>
    <form id="forgotForm">
      <input type="email" id="email" placeholder="Registered email" required>
      <input type="password" id="newPassword" placeholder="New password" required minlength="6">
      <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
      <button type="submit">Reset Password</button>
    </form>
    <p id="message"></p>
    <a href="login.html">Back to login</a>
  </div>

  <script>
    document.getElementById("forgotForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("message");

      if (email !== "admin@gmail.com") {
        message.style.color = "red";
        message.textContent = "Email not found.";
        return;
      }

      if (newPassword !== confirmPassword) {
        message.style.color = "red";
        message.textContent = "Passwords do not match.";
        return;
      }

      localStorage.setItem("adminPassword", newPassword);
      message.style.color = "green";
      message.textContent = "Password changed! Redirecting to login...";

      setTimeout(function () {
        window.location.href = "login.html";
      }, 1500);
    });
  </script>
</body>
</html>
