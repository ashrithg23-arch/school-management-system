
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Login Page</title>

  <!-- CSS -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0f172a, #4338ca, #818cf8);
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 35px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .logo {
      text-align: center;
      font-size: 45px;
      margin-bottom: 15px;
    }

    h1 {
      color: #1e1b4b;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .form-group input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px #4f46e51a;
    }

    .password-wrapper {
      display: flex;
      align-items: center;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding-right: 10px;
    }

    .password-wrapper:focus-within {
      border-color: #4f46e5;
    }

    .password-wrapper input {
      border: none;
      box-shadow: none;
    }

    .password-wrapper input:focus {
      box-shadow: none;
    }

    .toggle-password {
      border: none;
      background: transparent;
      color: #4f46e5;
      cursor: pointer;
      font-size: 13px;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 20px 0;
      font-size: 12px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #555;
    }

    a {
      color: #4f46e5;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-button:hover {
      background: #3730a3;
    }

    #message {
      text-align: center;
      font-size: 13px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .signup {
      text-align: center;
      margin-top: 25px;
      color: #666;
      font-size: 13px;
    }

    @media (max-width: 450px) {
      .login-container {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- HTML -->
  <div class="login-container">
    <div class="logo">🔐</div>

    <h1>Welcome Back!</h1>
    <p class="subtitle">Login to access your account</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
          >Show</button>
        </div>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="remember">
          Remember me
        </label>

        <a href="forget.html" id="forgotPassword">Forgot password?</a>
      </div>

      <button type="submit" class="login-button">Login</button>
    <p id="message" role="status" aria-live="polite"></p>
    </form>
   <p class="signup">
      Don't have an account?
      <a href="sign.html" id="signupLink">Sign up</a>
    </p>
  </div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    var email = document.getElementById("email").value;
    var password = document.getElementById("password").value;

    if (email !== "" && password !== "") {
        window.location.href = "dash.html";
    }
});
</script>
</body>
</html>
